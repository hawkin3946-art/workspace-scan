name: Build workspace_scan_1

on:
  push:
    branches: [workspace_scan_1]
    paths:
      - '.impeccable-import/**'
      - '.github/workflows/build-workspace-scan-1.yml'

permissions:
  contents: write

jobs:
  assemble:
    if: contains(github.event.head_commit.message, 'Stage Impeccable 4 build')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Assemble verified build
        run: cat .impeccable-import/part-*.txt > index.html

      - name: Remove one-time staging files
        run: rm -rf .impeccable-import .github/workflows/build-workspace-scan-1.yml

      - name: Commit final workspace_scan_1
        run: |
          git config user.name "hawkin3946-art"
          git config user.email "hawkin3946@gmail.com"
          git add -A
          git commit -m "Impeccable 4 workspace scan UX overhaul"
          git push
