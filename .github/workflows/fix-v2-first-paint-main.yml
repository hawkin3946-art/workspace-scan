name: Repair v2 first paint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-v2-first-paint-main.yml'

permissions:
  contents: write

jobs:
  repair:
    if: github.event.head_commit.message == 'Run v2 first-paint repair'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch branch and published copy
        shell: bash
        run: |
          git config user.name "hawkin3946-art"
          git config user.email "hawkin3946@gmail.com"
          git fetch origin main workspace_scan_2

          git switch -C workspace_scan_2 origin/workspace_scan_2
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          urls=[
            'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
            'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
            'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'
          ]
          for url in urls:
            s=s.replace(f'<script src="{url}"></script>', f'<script async src="{url}"></script>')
          p.write_text(s)
          assert '<script src="https://cdn.jsdelivr.net/npm/@tensorflow' not in s
          PY
          git rm -f .github/workflows/fix-v2-first-paint.yml || true
          git add index.html
          git commit -m "Fix v2 black screen with non-blocking dependencies"
          git push origin HEAD:workspace_scan_2

          git switch -C main origin/main
          python - <<'PY'
          from pathlib import Path
          p=Path('workspace_scan_2/index.html')
          s=p.read_text()
          urls=[
            'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js',
            'https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js',
            'https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'
          ]
          for url in urls:
            s=s.replace(f'<script src="{url}"></script>', f'<script async src="{url}"></script>')
          p.write_text(s)
          assert '<script src="https://cdn.jsdelivr.net/npm/@tensorflow' not in s
          PY
          git rm -f .github/workflows/fix-v2-first-paint-main.yml
          git add workspace_scan_2/index.html
          git commit -m "Publish v2 black-screen repair"
          git push origin HEAD:main
