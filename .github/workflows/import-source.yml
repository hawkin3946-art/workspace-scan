name: One-time source import

on:
  push:
    paths:
      - '.github/workflows/import-source.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.event.head_commit.message == 'Run one-time source import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination
        uses: actions/checkout@v4

      - name: Fetch source files exactly
        run: |
          curl -fsSL https://raw.githubusercontent.com/ibScottB64/360_Scan_5/main/index.html -o index.html
          curl -fsSL https://raw.githubusercontent.com/ibScottB64/360_Scan_5/main/README.md -o README.md

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Import 360_Scan_5 source"
            git push
          fi
