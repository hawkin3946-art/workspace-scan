    coco: ['https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js','https://unpkg.com/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'],
    zip: ['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js']
  };
  function loadScriptOnce(src, globalName, timeoutMs = 6500) {
    if (globalName && window[globalName]) return Promise.resolve();
    if (scriptLoads.has(src)) return scriptLoads.get(src);
    const promise = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      const timeout = setTimeout(() => { script.remove(); reject(new Error(`Timed out loading ${src}`)); }, timeoutMs);
      script.src = src; script.async = true; script.crossOrigin = 'anonymous';
      script.onload = () => { clearTimeout(timeout); if (!globalName || window[globalName]) resolve(); else reject(new Error(`${globalName} unavailable`)); };
      script.onerror = () => { clearTimeout(timeout); script.remove(); reject(new Error(`Failed to load ${src}`)); };
      document.head.appendChild(script);
    }).catch(error => { scriptLoads.delete(src); throw error; });
    scriptLoads.set(src, promise); return promise;
  }
  async function loadFirstAvailable(urls, globalName) { let lastError=null; for (const src of urls) { try { await loadScriptOnce(src, globalName); return; } catch (e) { lastError=e; } } throw lastError || new Error(`Unable to load ${globalName}`); }
  async function ensureRecognitionLibraries() { if (!window.tf) await loadFirstAvailable(LIBRARY_URLS.tf,'tf'); if (!window.cocoSsd) await loadFirstAvailable(LIBRARY_URLS.coco,'cocoSsd'); }
  async function ensureZipLibrary() { if (!window.JSZip) await loadFirstAvailable(LIBRARY_URLS.zip,'JSZip'); }

  const icons = {'''
