<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>Workspace Scan</title>
<script async src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg: #07090d;
  --surface: rgba(15, 18, 24, .82);
  --surface-strong: rgba(9, 11, 16, .94);
  --surface-soft: rgba(255,255,255,.08);
  --line: rgba(255,255,255,.14);
  --line-strong: rgba(255,255,255,.28);
  --text: #f7f8fb;
  --muted: #a9b0bd;
  --subtle: #7c8594;
  --accent: #8be45d;
  --accent-strong: #a6f27d;
  --warning: #ffd166;
  --danger: #ff786f;
  --info: #7eb8ff;
  --shadow: 0 18px 60px rgba(0,0,0,.42);
  --radius-lg: 28px;
  --radius-md: 18px;
  --radius-sm: 12px;
  --safe-top: max(16px, env(safe-area-inset-top));
  --safe-bottom: max(16px, env(safe-area-inset-bottom));
  font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { width: 100%; height: 100%; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
button, a { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 3px solid rgba(126,184,255,.9); outline-offset: 3px; }
.hidden { display: none !important; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }

/* ---------- Welcome ---------- */
#welcomeScreen {
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: var(--safe-top) 22px var(--safe-bottom);
  background:
    radial-gradient(circle at 50% -20%, rgba(126,184,255,.14), transparent 42%),
    linear-gradient(180deg, #0c1017 0%, #07090d 58%, #05070a 100%);
}
.welcome-topbar { display: flex; align-items: center; justify-content: space-between; min-height: 48px; }
.brand-lockup { display: flex; align-items: center; gap: 10px; font-weight: 650; letter-spacing: -.01em; }
.brand-mark { width: 30px; height: 30px; border-radius: 10px; display: grid; place-items: center; background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.10); }
.brand-mark svg { width: 18px; height: 18px; fill: none; stroke: var(--text); stroke-width: 1.8; }
.version-display { font-size: 11px; color: var(--subtle); letter-spacing: .04em; text-transform: uppercase; }
.sound-button, .icon-button {
  min-width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line);
  background: rgba(255,255,255,.06); color: var(--text); display: inline-flex; align-items: center; justify-content: center;
  gap: 7px; cursor: pointer; transition: background .18s ease, border-color .18s ease, transform .18s ease;
}
.sound-button:hover, .icon-button:hover { background: rgba(255,255,255,.10); border-color: var(--line-strong); }
.sound-button:active, .icon-button:active { transform: scale(.97); }
.sound-button svg, .icon-button svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.sound-button .sound-label { display: none; }
.sound-button[data-enabled="true"] { color: var(--accent-strong); border-color: rgba(139,228,93,.28); background: rgba(139,228,93,.08); }

.welcome-content { flex: 1; width: min(100%, 480px); margin: 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 24px 0 18px; }
.eyebrow { display: inline-flex; align-items: center; gap: 8px; color: var(--accent-strong); font-size: 13px; font-weight: 650; letter-spacing: .02em; margin-bottom: 14px; }
.eyebrow::before { content: ""; width: 8px; height: 8px; border-radius: 99px; background: var(--accent); box-shadow: 0 0 0 5px rgba(139,228,93,.10); }
h1 { margin: 0; font-size: clamp(34px, 9vw, 46px); line-height: 1.02; letter-spacing: -.045em; font-weight: 720; }
.lede { margin: 18px 0 0; color: var(--muted); font-size: 16px; line-height: 1.55; max-width: 39ch; }
.setup-card { margin-top: 34px; border: 1px solid var(--line); background: rgba(255,255,255,.045); border-radius: var(--radius-lg); overflow: hidden; box-shadow: inset 0 1px rgba(255,255,255,.03); }
.setup-step { min-height: 78px; padding: 16px 17px; display: grid; grid-template-columns: 38px 1fr auto; align-items: center; gap: 13px; }
.setup-step + .setup-step { border-top: 1px solid rgba(255,255,255,.075); }
.step-icon { width: 38px; height: 38px; border-radius: 13px; display: grid; place-items: center; background: rgba(255,255,255,.07); color: var(--text); }
.step-icon svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.step-copy strong { display: block; font-size: 15px; font-weight: 630; letter-spacing: -.01em; }
.step-copy span { display: block; color: var(--subtle); margin-top: 3px; font-size: 13px; line-height: 1.35; }
.step-number { color: rgba(255,255,255,.26); font-size: 12px; font-variant-numeric: tabular-nums; }
.welcome-actions { width: min(100%, 480px); margin: 0 auto; padding-top: 12px; }
.primary-button {
  width: 100%; min-height: 58px; border: 0; border-radius: 18px; background: var(--text); color: #07090d;
  font-weight: 700; font-size: 16px; letter-spacing: -.01em; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px;
  box-shadow: 0 10px 35px rgba(0,0,0,.25); transition: transform .18s ease, opacity .18s ease;
}
.primary-button:active { transform: scale(.985); }
.primary-button:disabled { opacity: .5; cursor: not-allowed; }
.primary-button svg { width: 19px; height: 19px; fill: none; stroke: currentColor; stroke-width: 2; }
.privacy-note { margin: 12px 8px 0; color: var(--subtle); font-size: 12px; line-height: 1.45; text-align: center; }

/* ---------- Scanner ---------- */
#scanScreen {
  width: min(100%, 520px); height: 100dvh; margin: 0 auto; position: relative; overflow: hidden; background: #000;
  display: grid; grid-template-rows: auto 1fr auto;
}
.scan-topbar {
  z-index: 40; display: grid; grid-template-columns: 48px 1fr 48px; align-items: center; gap: 8px;
  padding: var(--safe-top) 14px 10px; background: linear-gradient(180deg, rgba(0,0,0,.82), rgba(0,0,0,.35) 72%, transparent);
  position: absolute; inset: 0 0 auto;
}
.scan-title { text-align: center; min-width: 0; }
.scan-title strong { display: block; font-size: 14px; font-weight: 650; letter-spacing: -.01em; }
.scan-title span { display: block; margin-top: 2px; color: rgba(255,255,255,.58); font-size: 11px; }
.scan-stage { position: absolute; inset: 0; background: #0a0b0d; overflow: hidden; }
#videoFeed { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #0d0f13; }
.video-vignette { position: absolute; inset: 0; z-index: 4; pointer-events: none; background: radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.05) 58%, rgba(0,0,0,.48) 100%); }
.quality-wash { position: absolute; inset: 0; z-index: 5; pointer-events: none; opacity: 0; transition: opacity .25s ease, background .25s ease; }
.quality-wash[data-state="ready"] { opacity: .26; background: linear-gradient(180deg, rgba(139,228,93,.10), transparent 38%, transparent 66%, rgba(139,228,93,.12)); }
.quality-wash[data-state="warning"] { opacity: .34; background: linear-gradient(180deg, rgba(255,209,102,.15), transparent 35%, transparent 65%, rgba(255,209,102,.16)); }
.quality-wash[data-state="danger"] { opacity: .42; background: linear-gradient(180deg, rgba(255,120,111,.18), transparent 35%, transparent 65%, rgba(255,120,111,.18)); }
.
