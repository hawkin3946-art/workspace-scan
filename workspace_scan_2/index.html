<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#07090d">
<title>Workspace Scan · Object Recognition</title>
<style>
:root{color-scheme:dark;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#07090d;color:#f7f8fb}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#07090d}body{display:grid;place-items:center;overflow:hidden}
#boot{width:min(88vw,420px);text-align:center;padding:28px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.045);box-shadow:0 24px 80px rgba(0,0,0,.45)}
.mark{width:46px;height:46px;margin:0 auto 18px;border-radius:15px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07)}
.mark svg{width:24px;height:24px;fill:none;stroke:#f7f8fb;stroke-width:1.8}.kicker{font-size:12px;color:#a6f27d;font-weight:700;letter-spacing:.04em;text-transform:uppercase}h1{font-size:24px;line-height:1.1;letter-spacing:-.03em;margin:9px 0 10px}p{margin:0;color:#a9b0bd;font-size:14px;line-height:1.5}.bar{height:3px;background:rgba(255,255,255,.08);border-radius:99px;margin:20px 0 0;overflow:hidden}.bar i{display:block;height:100%;width:42%;background:#a6f27d;border-radius:99px;animation:load 1.1s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(138%)}}#bootError{display:none;color:#ff9a92;margin-top:14px;font-size:13px;line-height:1.45}button{display:none;margin:18px auto 0;border:0;border-radius:14px;background:#f7f8fb;color:#07090d;font:700 14px/1 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:14px 18px;min-height:46px}
</style>
</head>
<body>
<main id="boot" role="status" aria-live="polite">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M4 7.5 12 3l8 4.5v9L12 21l-8-4.5z"/><circle cx="12" cy="12" r="3.2"/></svg></div>
  <div class="kicker">Workspace Scan 2</div>
  <h1>Preparing camera intelligence</h1>
  <p id="bootText">Loading the verified scan experience…</p>
  <div class="bar" id="bootBar"><i></i></div>
  <div id="bootError"></div>
  <button id="retry" type="button">Try again</button>
</main>
<script>
(() => {
  const BASE = '../workspace_scan_1/index.html';
  const bootText = document.getElementById('bootText');
  const bootError = document.getElementById('bootError');
  const retry = document.getElementById('retry');
  const bootBar = document.getElementById('bootBar');

  const AI_CSS = `
#ws2ObjectCanvas{position:absolute;inset:0;width:100%;height:100%;z-index:9;pointer-events:none;transition:opacity .18s ease}
#ws2RecognitionPill{position:absolute;z-index:27;top:calc(max(16px,env(safe-area-inset-top)) + 126px);left:18px;max-width:calc(100% - 36px);min-height:30px;padding:7px 10px;border-radius:999px;border:1px solid rgba(126,184,255,.26);background:rgba(7,10,15,.66);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:inline-flex;align-items:center;gap:7px;color:rgba(236,244,255,.9);font:620 11px/1.2 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#ws2RecognitionPill[hidden]{display:none}.ws2AiDot{width:7px;height:7px;border-radius:50%;background:#7eb8ff;box-shadow:0 0 0 4px rgba(126,184,255,.10)}
#ws2RecognitionPill[data-state="ready"] .ws2AiDot{background:#8be45d;box-shadow:0 0 0 4px rgba(139,228,93,.10)}
#ws2RecognitionPill[data-state="unavailable"]{color:rgba(255,255,255,.58);border-color:rgba(255,255,255,.12)}#ws2RecognitionPill[data-state="unavailable"] .ws2AiDot{background:#7c8594;box-shadow:none}
`;

  const AI_JS = `
(() => {
  const video=document.getElementById('videoFeed');
  const stage=document.querySelector('.scan-stage');
  const scanScreen=document.getElementById('scanScreen');
  const start=document.getElementById('startButton');
  if(!video||!stage||!scanScreen||!start){console.warn('Workspace Scan 2: base UI hooks unavailable');return;}
  const canvas=document.createElement('canvas'); canvas.id='ws2ObjectCanvas'; stage.appendChild(canvas);
  const pill=document.createElement('div'); pill.id='ws2RecognitionPill'; pill.hidden=true; pill.dataset.state='loading'; pill.innerHTML='<span class="ws2AiDot"></span><span id="ws2AiText">AI recognition loading…</span>'; stage.appendChild(pill);
  const pillText=pill.querySelector('#ws2AiText');
  const ctx=canvas.getContext('2d');
  const priority=new Set(['laptop','keyboard','mouse','chair','cell phone','book','tv','bottle','cup']);
  const seen=new Map(); let model=null,modelPromise=null,running=false,timer=0,session=0;
  const THRESHOLD=.58, INTERVAL=360, MAX=4;
  function setState(state,text){pill.hidden=false;pill.dataset.state=state;pillText.textContent=text;}
  function loadScript(url,globalName,timeout=2500){return new Promise((resolve,reject)=>{if(window[globalName])return resolve();const s=document.createElement('script');let done=false;const finish=(ok,err)=>{if(done)return;done=true;clearTimeout(t);if(!ok)s.remove();ok?resolve():reject(err)};const t=setTimeout(()=>finish(false,new Error('timeout '+url)),timeout);s.src=url;s.async=true;s.onload=()=>finish(!!window[globalName],new Error(globalName+' missing'));s.onerror=()=>finish(false,new Error('load failed '+url));document.head.appendChild(s)})}
  async function first(urls,name){let err;for(const u of urls){try{await loadScript(u,name);return}catch(e){err=e}}throw err||new Error('Unable to load '+name)}
  async function libraries(){if(!window.tf)await first(['https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.22.0/dist/tf.min.js','https://unpkg.com/@tensorflow/tfjs@4.22.0/dist/tf.min.js'],'tf');if(!window.cocoSsd)await first(['https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js','https://unpkg.com/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js'],'cocoSsd')}
  function clear(){ctx.clearRect(0,0,canvas.width,canvas.height)}
  function fit(preds){return preds.filter(p=>p.score>=THRESHOLD).sort((a,b)=>(priority.has(b.class)-priority.has(a.class))||(b.score-a.score)).slice(0,MAX)}
  function render(preds){const r=stage.getBoundingClientRect(),vw=video.videoWidth||1,vh=video.videoHeight||1,dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(r.width*dpr);canvas.height=Math.round(r.height*dpr);canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,r.width,r.height);const scale=Math.max(r.width/vw,r.height/vh),dw=vw*scale,dh=vh*scale,ox=(r.width-dw)/2,oy=(r.height-dh)/2;ctx.font='600 12px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif';for(const p of preds){const x=ox+p.bbox[0]*scale,y=oy+p.bbox[1]*scale,w=p.bbox[2]*scale,h=p.bbox[3]*scale;ctx.strokeStyle='rgba(126,184,255,.95)';ctx.lineWidth=2;ctx.strokeRect(x,y,w,h);const label=p.class+' '+Math.round(p.score*100)+'%';const tw=ctx.measureText(label).width+14;const ly=Math.max(4,y-25);ctx.fillStyle='rgba(7,10,15,.84)';ctx.beginPath();ctx.roundRect(x,ly,tw,22,7);ctx.fill();ctx.fillStyle='#eef6ff';ctx.fillText(label,x+7,ly+15);const old=seen.get(p.class)||0;seen.set(p.class,Math.max(old,p.score))}}
  function schedule(ms=INTERVAL){clearTimeout(timer);if(running)timer=setTimeout(detect,ms)}
  async function detect(){if(!running||!model||scanScreen.classList.contains('hidden')){clear();return}if(video.readyState<2){schedule();return}try{const preds=fit(await model.detect(video,12,THRESHOLD));render(preds);setState('ready',preds.length?('AI · '+preds.map(p=>p.class).join(' · ')):'AI · Scanning objects');}catch(e){console.warn('Object detection frame failed',e)}schedule()}
  async function begin(){const id=++session;running=false;clearTimeout(timer);clear();setState('loading','AI recognition loading…');first(['https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js','https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js'],'JSZip').catch(()=>{});try{await libraries();if(id!==session||scanScreen.classList.contains('hidden'))return;try{if(tf.getBackend()!=='webgl')await tf.setBackend('webgl')}catch(_){try{await tf.setBackend('cpu')}catch(__){}}await tf.ready();if(!modelPromise)modelPromise=cocoSsd.load({base:'lite_mobilenet_v2'});model=await modelPromise;if(id!==session||scanScreen.classList.contains('hidden'))return;running=true;setState('ready','AI · Scanning objects');schedule(0)}catch(e){modelPromise=null;running=false;clear();setState('unavailable','AI recognition unavailable · scan still works');console.warn('Workspace Scan 2 AI unavailable',e)}}
  function stop(){session++;running=false;clearTimeout(timer);clear();pill.hidden=true}
  start.addEventListener('click',()=>setTimeout(()=>{if(!scanScreen.classList.contains('hidden'))begin()},250));
  new MutationObserver(()=>{if(scanScreen.classList.contains('hidden'))stop()}).observe(scanScreen,{attributes:true,attributeFilter:['class']});
  addEventListener('resize',()=>{if(running)clear()});
})();`;

  async function launch(){
    bootError.style.display='none'; retry.style.display='none'; bootBar.style.display='block';
    bootText.textContent='Loading the verified scan experience…';
    try{
      const controller=new AbortController(); const timeout=setTimeout(()=>controller.abort(),8000);
      const response=await fetch(BASE+'?base=bd00297c',{cache:'no-store',signal:controller.signal}); clearTimeout(timeout);
      if(!response.ok) throw new Error('Base scan returned '+response.status);
      let html=await response.text();
      html=html.replace(/<script[^>]+src=["']https:\/\/cdnjs\.cloudflare\.com\/ajax\/libs\/jszip\/3\.10\.1\/jszip\.min\.js["'][^>]*><\/script>\s*/i,'');
      if(!html.includes('id="welcomeScreen"')||!html.includes('id="videoFeed"')||!html.includes('</html>')) throw new Error('Base scan failed integrity check');
      html=html.replace('</head>','<style>'+AI_CSS+'</style></head>');
      html=html.replace('</body>','<script>'+AI_JS+'<'+'/script></body>');
      document.open(); document.write(html); document.close();
    }catch(err){
      console.error('Workspace Scan 2 bootstrap failed',err); bootBar.style.display='none';
      bootText.textContent='The scan could not be prepared.'; bootError.style.display='block';
      bootError.textContent='Nothing was started and no camera access was requested. Check your connection, then try again.';
      retry.style.display='inline-block';
    }
  }
  retry.addEventListener('click',launch); launch();
})();
</script>
</body>
</html>
